config firewall policy
    edit 1
        set name "Allow-HTTPS-To-VIP"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "WEB-443"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 2
        set name "Internal-Outbound"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Users" "Servers"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
end