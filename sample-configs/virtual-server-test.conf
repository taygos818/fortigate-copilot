config firewall virtual-server
    edit "WEB-LB"
        set interface "wan1"
        set ip 203.0.113.20
        set port 443
        set type https
        set ldb-method static
        set server-type ip
    next
    edit "APP-LB"
        set interface "wan1"
        set ip 203.0.113.21
        set port 8443
        set type tcp
        set ldb-method round-robin
        set server-type ip
    next
end