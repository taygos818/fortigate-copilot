#global_vdom=1
# Synthetic example. Every name, address and comment below is made up.
# Public addresses use the RFC 5737 documentation ranges (192.0.2.0/24,
# 198.51.100.0/24, 203.0.113.0/24). Internal addresses are RFC 1918.
config system global
    set hostname "FGT-EXAMPLE"
    set timezone 12
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping
        set type physical
        set alias "ISP-A"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping
        set type physical
        set alias "ISP-B"
        set role wan
    next
    edit "internal1"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "dmz"
        set vdom "root"
        set ip 10.30.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
    next
end
config system zone
    edit "INTERNET"
        set interface "port1" "port2"
    next
end
config firewall address
    edit "all"
        set uuid 00000000-0000-0000-0000-000000000001
    next
    edit "PARTNER-NET-1"
        set subnet 192.0.2.0 255.255.255.0
    next
    edit "PARTNER-NET-2"
        set subnet 198.51.100.64 255.255.255.192
    next
    edit "LAN-USERS"
        set subnet 10.20.0.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "PARTNERS"
        set member "PARTNER-NET-1" "PARTNER-NET-2"
    next
    edit "ANY-SOURCE-GRP"
        set member "all"
    next
end
config firewall service custom
    edit "TCP-8443"
        set tcp-portrange 8443
    next
    edit "SFTP-2222"
        set tcp-portrange 2222
    next
end
config firewall vip
    edit "VIP-WEB-HTTPS"
        set uuid 00000000-0000-0000-0000-000000000101
        set comment "Public website"
        set extip 203.0.113.10
        set mappedip "10.30.0.10"
        set extintf "port1"
        set portforward enable
        set extport 443
        set mappedport 443
    next
    edit "VIP-WEB-HTTP"
        set extip 203.0.113.10
        set mappedip "10.30.0.10"
        set extintf "port1"
        set portforward enable
        set extport 80
        set mappedport 80
    next
    edit "VIP-SFTP"
        set comment "Partner file drop"
        set extip 198.51.100.10
        set mappedip "10.30.0.20"
        set extintf "port2"
        set portforward enable
        set extport 2222
        set mappedport 22
    next
    edit "VIP-APP-LB"
        set type server-load-balance
        set extip 203.0.113.12
        set extintf "port1"
        set server-type https
        set extport 443
        set ldb-method round-robin
        config realservers
            edit 1
                set ip 10.30.0.31
                set port 8443
            next
            edit 2
                set ip 10.30.0.32
                set port 8443
            next
        end
    next
    edit "VIP-RDP-OLD"
        set comment "Retired jump host"
        set extip 203.0.113.13
        set mappedip "10.30.0.40"
        set extintf "port1"
        set portforward enable
        set extport 3389
        set mappedport 3389
    next
    edit "VIP-MGMT-ANY"
        set extip 203.0.113.14
        set mappedip "10.20.0.50"
        set extintf "any"
    next
end
config firewall vipgrp
    edit "VIPGRP-WEB"
        set interface "port1"
        set member "VIP-WEB-HTTPS" "VIP-WEB-HTTP"
    next
end
config firewall policy
    edit 10
        set name "Inbound-Website"
        set uuid 00000000-0000-0000-0000-000000001010
        set srcintf "port1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "VIPGRP-WEB"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set logtraffic all
        set comments "Website \"www\" via VIP group"
    next
    edit 11
        set name "Inbound-Partner-SFTP"
        set srcintf "port2"
        set dstintf "dmz"
        set action accept
        set srcaddr "PARTNERS"
        set dstaddr "VIP-SFTP"
        set schedule "always"
        set service "SFTP-2222"
        set logtraffic all
    next
    edit 12
        set name "Inbound-App-LB"
        set srcintf "INTERNET"
        set dstintf "dmz"
        set action accept
        set srcaddr "ANY-SOURCE-GRP"
        set dstaddr "VIP-APP-LB"
        set schedule "always"
        set service "ALL"
    next
    edit 13
        set name "Inbound-RDP-Disabled"
        set status disable
        set srcintf "port1"
        set dstintf "dmz"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-RDP-OLD"
        set schedule "always"
        set service "RDP"
    next
    edit 14
        set name "Inbound-Mgmt"
        set srcintf "port1"
        set dstintf "internal1"
        set action accept
        set srcaddr "PARTNER-NET-1"
        set dstaddr "VIP-MGMT-ANY"
        set schedule "always"
        set service "HTTPS"
    next
    edit 20
        set name "LAN-to-Internet"
        set srcintf "internal1"
        set dstintf "INTERNET"
        set action accept
        set srcaddr "LAN-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
