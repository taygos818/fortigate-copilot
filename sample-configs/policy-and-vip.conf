config firewall vip
    edit "WEB-443"
        set extip 203.0.113.10
        set extintf "wan1"
        set mappedip "10.10.10.25"
        set portforward enable
        set extport 443
        set mappedport 443
    next
    edit "RDP-8443"
        set extip 203.0.113.11
        set extintf "wan1"
        set mappedip "10.10.10.50"
        set portforward enable
        set extport 8443
        set mappedport 3389
    next
    edit "UNUSED-VIP"
        set extip 203.0.113.12
        set extintf "wan1"
        set mappedip "10.10.10.99"
        set portforward enable
        set extport 9443
        set mappedport 9443
    next
end

config firewall policy
    edit 101
        set name "Allow-HTTPS-To-WEB"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "WEB-443"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 102
        set name "Allow-RDP-Publish"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "Branch-Offices"
        set dstaddr "RDP-8443"
        set action accept
        set schedule "always"
        set service "TCP-8443"
        set logtraffic all
    next
    edit 103
        set name "Internal-Outbound"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Users"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
end